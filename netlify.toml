# Netlify build settings (read automatically when the repo is connected).
# The primary domain is www.mdimophotography.bg; Netlify redirects the bare
# domain (and the .netlify.app address) to it automatically once both are added.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12+ (matches .nvmrc).
  NODE_VERSION = "22"

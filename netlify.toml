# Netlify build settings (read automatically when the repo is connected).
# The primary domain is mdimophotography.bg (DNS is hosted by Netlify, so the bare
# domain is served from the CDN directly); Netlify redirects www and the
# .netlify.app address to it automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12+ (matches .nvmrc).
  NODE_VERSION = "22"
